<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jardín Mi Amor</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: linear-gradient(#87ceeb, #e0f7fa);
}

/* 🌳 Árbol */
.tree {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  font-size: 180px;
}

/* 🌸 Flores */
.flower {
  position: absolute;
  font-size: 22px;
  animation: float 6s infinite ease-in-out;
}

/* Tipos de flores */
.sunflower { color: #f4c542; }
.rose { color: #e63946; }
.tulip { color: #ff8fab; }
.daisy { color: #ffffff; }
.lily { color: #cdb4db; }

/* 🌼 Animación suave */
@keyframes float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-8px); }
  100% { transform: translateY(0px); }
}

/* 📱 Ajustes para celular */
@media (max-width: 600px) {
  .tree {
    font-size: 220px; /* más grande en celular */
  }

  .flower {
    font-size: 24px;
  }
}
</style>
</head>

<body>

<!-- 🌳 Árbol -->
<div class="tree">🌳</div>

<!-- 🌻 Girasoles (POCOS, tranquilos) -->
<div class="flower sunflower" style="top: 75%; left: 10%;">🌻</div>
<div class="flower sunflower" style="top: 80%; left: 85%;">🌻</div>

<!-- 🌸 Otras flores (más variedad, bien distribuidas) -->
<div class="flower rose" style="top: 78%; left: 20%;">🌹</div>
<div class="flower tulip" style="top: 82%; left: 35%;">🌷</div>
<div class="flower daisy" style="top: 76%; left: 50%;">🌼</div>
<div class="flower lily" style="top: 83%; left: 65%;">🌸</div>

<div class="flower rose" style="top: 85%; left: 15%;">🌹</div>
<div class="flower tulip" style="top: 88%; left: 30%;">🌷</div>
<div class="flower daisy" style="top: 84%; left: 55%;">🌼</div>
<div class="flower lily" style="top: 87%; left: 75%;">🌸</div>

</body>
</html>
